<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#1f2d27; --sub:#5b6b64; --line:#dfe6e2;

}
@media (prefers-color-scheme: dark){

}
:root[data-theme="dark"]{ --bg:#121815; --card:#1a221e; --ink:#eaf1ec; --sub:#9fb3a9; --line:#2a352f; --accent:#4fae86; --accent-d:#6ec59f; --chip:#1f2c26; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100%;}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 60px;}
header.top{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
header.top h1{font-size:15px;margin:0;line-height:1.3;}
header.top small{color:var(--sub);display:block;font-weight:400;}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;}
.btn:hover{background:var(--accent-d);}
.btn.ghost{background:transparent;color:var(--accent-d);border:1px solid var(--line);}
.btn.small{padding:7px 12px;font-size:12.5px;}
.btn.danger{background:var(--danger);}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;}
.card h2{margin:0 0 4px;font-size:17px;}
.card h3{margin:20px 0 8px;font-size:14px;color:var(--accent-d);border-bottom:1px dashed var(--line);padding-bottom:6px;}
.card h4{margin:14px 0 6px;font-size:12.8px;color:var(--sub);text-transform:uppercase;letter-spacing:.02em;}
.hint{color:var(--sub);font-size:12.5px;margin:0 0 14px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:620px){.grid,.grid3{grid-template-columns:1fr;}}
label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px;font-weight:600;}
.field{margin-bottom:12px;}
input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:13.5px;font-family:inherit;
}
textarea{min-height:64px;resize:vertical;}
.center{display:flex;align-items:center;justify-content:center;min-height:70vh;padding:20px;}
.login-card{max-width:380px;width:100%;text-align:center;}
.choice{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
.choice .btn{flex:1;min-width:140px;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--sub);padding:8px 13px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.block{border:1px dashed var(--line);border-radius:12px;padding:14px;margin-bottom:12px;position:relative;}
.block .rm{position:absolute;top:8px;right:8px;}
.chk-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:8px;}
.chk-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.chk-row input[type=checkbox]{width:16px;height:16px;flex:0 0 auto;}
.submit-bar{position:sticky;bottom:0;bottom:env(safe-area-inset-bottom,0px);background:var(--bg);padding:12px 0;margin-top:10px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);flex-wrap:wrap;}
.subm-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.subm-item:hover{border-color:var(--accent);}
.status{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;}
.status.new{background:#fde7e0;color:#a3400f;}
.status.graded{background:var(--chip);color:var(--accent-d);}
.readonly-box{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;white-space:pre-wrap;min-height:20px;margin-bottom:6px;}
table.eval{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
table.eval th,table.eval td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top;}
table.eval th{background:var(--chip);color:var(--accent-d);font-size:12px;}
table.eval input{width:70px;}
.toplam{font-size:20px;font-weight:800;color:var(--accent-d);}
.msg{font-size:12.5px;padding:8px 12px;border-radius:9px;margin-bottom:10px;}
.msg.err{background:#fde7e0;color:#a3400f;}
.msg.ok{background:var(--chip);color:var(--accent-d);}
.small-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.small-table th,.small-table td{border:1px solid var(--line);padding:6px;}

.overflow-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.print-header{display:none;}

<script>
// ==================== GOOGLE SHEETS / APPS SCRIPT YAPILANDIRMASI ====================
// Bu uygulamayı GitHub Pages, Netlify vb. bir yerde (claude.ai dışında) yayınlıyorsanız
// aşağıdaki bilgileri KENDİ ücretsiz Firebase projenizin bilgileriyle doldurun.
// Nasıl alınacağı için sohbetteki kurulum talimatlarına bakın.
// claude.ai üzerinde artifact olarak kullanıyorsanız bu alanı BOŞ bırakabilirsiniz,
// sistem otomatik olarak Claude'un kendi paylaşılan veritabanını kullanır.
window.FIREBASE_CONFIG = {}; // Bu sürümde kullanılmıyor. Veri Google Sheets'e gider.
// EN KOLAY YÖNTEM: Google E-Tablolar + Apps Script kullanmak isterseniz,
// aşağıya Apps Script "Web App" dağıtım URL'nizi yapıştırın (aşağıdaki gibi biter: /exec)
// Firebase'e HİÇ gerek kalmaz. Kurulum talimatları sohbette verildi.
window.SHEETS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxgr3tq_NPZgOoAEG6IB6FYpJuKFMzxegBSoddUmMUZhlPKXS-ndshamvKRPiUgIdHFWQ/exec;
</script>

<script>
let dbNS=null;
const Storage = {
  backend: 'none',
  ns: null,
  async init(){
    // 1) Önce claude.ai artifact ortamı denenir
    if(typeof window.claude !== 'undefined' && window.claude && window.claude.use){
      try{
        const ns = await window.claude.use('db');
        if(ns){ this.ns = ns; this.backend = 'claude'; return; }
      }catch(e){}
    }
    // 2) Google E-Tablolar (Apps Script Web App) yapılandırılmışsa - en kolay yöntem
    if(window.SHEETS_WEBAPP_URL && window.SHEETS_WEBAPP_URL.trim() && !window.SHEETS_WEBAPP_URL.includes("BURAYA_APPS_SCRIPT_EXEC_URL_YAPISTIRIN")){
      this.ns = window.SHEETS_WEBAPP_URL.trim();
      this.backend = 'sheets';
      return;
    }
    // 3) Firebase yapılandırılmışsa
    const cfg = window.FIREBASE_CONFIG;
    if(cfg && cfg.apiKey && cfg.projectId && typeof firebase !== 'undefined'){
      try{
        firebase.initializeApp(cfg);
        this.ns = firebase.firestore();
        this.backend = 'firebase';
        return;
      }catch(e){ console.error('Firebase başlatılamadı', e); }
    }
    this.backend = 'none';
  },
  async setSubmission(id, data){
    if(this.backend==='claude') return this.ns.doc('submissions/'+id).set(data);
    if(this.backend==='firebase') return this.ns.collection('submissions').doc(id).set(data);
    if(this.backend==='sheets'){
      const res = await fetch(this.ns, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'save', id, data}) });
      return res.json().catch(()=>({}));
    }
    throw new Error('no-backend');
  },
  async getSubmissions(){
    if(this.backend==='claude'){
      const res = await this.ns.collection('submissions').get();
      const docs = res && res.docs ? res.docs : (Array.isArray(res)?res:[]);
      return docs.map(d=> (d.data ? d.data() : d)).filter(Boolean);
    }
    if(this.backend==='firebase'){
      const snap = await this.ns.collection('submissions').get();
      const arr=[]; snap.forEach(doc=>arr.push(doc.data()));
      return arr;
    }
    if(this.backend==='sheets'){
      const res = await fetch(this.ns + (this.ns.includes('?')?'&':'?') + 't=' + Date.now());
      const data = await res.json();
      return Array.isArray(data) ? data : [];
    }
    return [];
  },
  async deleteSubmission(id){
    if(this.backend==='claude') return this.ns.doc('submissions/'+id).delete();
    if(this.backend==='firebase') return this.ns.collection('submissions').doc(id).delete();
    if(this.backend==='sheets'){
      const res = await fetch(this.ns, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'delete', id}) });
      return res.json().catch(()=>({}));
    }
  }
};

function renderStudent(){
  const activeTab = form._tab || 'bilgi';
  return `<header class="top"><div><h1>Öğrenci Uygulama Dosyası<br><small>Halk Sağlığı Hemşireliği Dersi</small></h1></div>
  <button class="btn ghost small" data-go="home">Ana Sayfa</button></header>
  <div class="wrap">
    <div class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${activeTab===t[0]?'active':''}">${t[1]}</button>`).join('')}</div>
    <div id="tabContent"></div>
    <div class="submit-bar"><span class="hint" id="saveHint"></span>
      <button class="btn ghost" id="printBtn">PDF Olarak İndir</button>
      <button class="btn" id="submitBtn">Akademisyene İlet</button>
    </div>
  </div>`;
}

function printStudentAll(){
  const el = document.getElementById('tabContent');
  const header = `<div class="print-header"><h2>Halk Sağlığı Hemşireliği Dersi — Öğrenci Uygulama Dosyası</h2>
    <p>${esc(form.ad)} — No: ${esc(form.no)}${form.alan1?(' — 1. Rotasyon: '+esc(form.alan1)):''}${form.alan2?(' — 2. Rotasyon: '+esc(form.alan2)):''}</p>
    <p>Yazdırma Tarihi: ${new Date().toLocaleDateString('tr-TR')}</p></div>`;
  const all = tabs.map(t=>`<h3 style="margin-top:22px;page-break-before:auto">${t[1]}</h3>` + TAB_MAP[t[0]]()).join('');
  el.innerHTML = header + all;
  window.print();
  setTimeout(renderTabContent, 300);
}

const TAB_MAP = {bilgi:tplBilgi,vaka:tplVaka,besin:tplBesin,bakim:tplBakim,toplum:tplToplum,tarama:tplTarama,egitim:tplEgitim,universite:tplUniversite,gunluk:tplGunluk};
function renderTabContent(){
  const c = document.getElementById('tabContent');
  const t = form._tab || 'bilgi';
  c.innerHTML = TAB_MAP[t]();
}

function inp(path,type,label,extra){
  const v = getPath(form,path) ?? "";
  extra = extra||"";
  if(type==='textarea') return `<div class="field"><label>${label}</label><textarea data-path="${path}" ${extra}>${esc(v)}</textarea></div>`;
  return `<div class="field"><label>${label}</label><input data-path="${path}" type="${type}" value="${esc(v)}" ${extra}></div>`;
}
function chk(path,label){
  const v = !!getPath(form,path);
  return `<label class="chk-row"><input type="checkbox" data-path="${path}" data-bool="1" ${v?'checked':''}> ${label}</label>`;
}

// ---------- delegated events (bound once) ----------
document.addEventListener('input', (e)=>{
  const p = e.target.dataset && e.target.dataset.path;
  if(!p) return;
  if(e.target.dataset.ensure){ /* handled in change for checkbox */ }
  if(e.target.type==='checkbox') return; // handled by change
  setPath(form, p, e.target.value);
});
document.addEventListener('change', (e)=>{
  const p = e.target.dataset && e.target.dataset.path;
  if(!p) return;
  if(e.target.type==='checkbox'){
    if(e.target.dataset.ensure && !getPath(form,e.target.dataset.ensure)) setPath(form,e.target.dataset.ensure,{});
    setPath(form, p, e.target.checked);
  } else if(e.target.tagName==='SELECT'){
    setPath(form, p, e.target.value);
  }
});
document.addEventListener('click', (e)=>{
  const addPath = e.target.dataset && e.target.dataset.add;
  if(addPath){
    const factory = BLANK_FACTORIES[e.target.dataset.factory];
    const arr = getPath(form, addPath);
    arr.push(factory());
    renderTabContent();
    return;
  }
  const rmPath = e.target.dataset && e.target.dataset.rm;
  if(rmPath){
    const arr = getPath(form, rmPath);
    arr.splice(+e.target.dataset.idx, 1);
    renderTabContent();
    return;
  }
});

function attachTopHandlers(){
  document.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const g = el.dataset.go;
      if(g==='student'){ if(!form.id && !form._started){ form = blankStudentForm(); } form._started=true; form._tab = form._tab||'bilgi'; state.view='student'; }
      else { state.view=g; }
      render();
    });
  });
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{ form._tab = el.dataset.tab; render(); });
  });
  document.getElementById('doLogin')?.addEventListener('click', async ()=>{
    const u = document.getElementById('fu').value.trim();
    const p = document.getElementById('fp').value.trim();
    if(u===FACULTY_USER && p===FACULTY_PASS){
      facultyAuthed = true;
      await loadSubmissions();
      state.view='faculty-panel'; render();
    } else {
      document.getElementById('loginMsg').innerHTML = '<div class="msg err">Kullanıcı adı veya şifre hatalı.</div>';
    }
  });
  document.getElementById('submitBtn')?.addEventListener('click', submitStudentForm);
  document.getElementById('printBtn')?.addEventListener('click', printStudentAll);
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.detailId = el.dataset.open; state.view='faculty-detail'; render(); });
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); deleteSubmission(el.dataset.del); });
  });
}

async function submitStudentForm(){
  const hint = document.getElementById('saveHint');
  if(!form.ad || !form.no){
    hint.textContent = 'Lütfen adınızı ve öğrenci numaranızı giriniz (Bilgiler sekmesi).';
    hint.style.color = 'var(--danger)';
    form._tab='bilgi'; render();
    return;
  }
  form.submittedAt = Date.now();
  form.status = 'yeni';
  const id = form.id || ('sub_' + Date.now() + '_' + Math.random().toString(36).slice(2,7));
  form.id = id;
  hint.textContent = 'Gönderiliyor...'; hint.style.color = 'var(--sub)';
  try{
    if(Storage.backend!=='none'){
      const clean = JSON.parse(JSON.stringify(form));
      delete clean._tab; delete clean._started;
      await Storage.setSubmission(id, clean);
      hint.textContent = 'Dosyanız akademisyene iletildi. Teşekkürler!'; hint.style.color = 'var(--accent-d)';
    } else {
      hint.textContent = 'Google Sheets bağlantısı kurulamadı. SHEETS_WEBAPP_URL alanını kontrol edin.'; hint.style.color = 'var(--danger)';
    }
  }catch(e){
    hint.textContent = 'Gönderim sırasında hata oluştu.'; hint.style.color = 'var(--danger)';
  }
}

async function loadSubmissions(){
  submissions = [];
  try{
    submissions = await Storage.getSubmissions();
    submissions.sort((a,b)=> (b.submittedAt||0)-(a.submittedAt||0));
  }catch(e){ submissions = []; }
}

  const rows = submissions.length ? submissions.map(s=>`
    <div class="subm-item">
      <div data-open="${s.id}" style="flex:1;cursor:pointer"><strong>${esc(s.ad)||'(isimsiz)'}</strong> — No: ${esc(s.no)||'-'}<br>
      <span class="hint">${s.submittedAt ? new Date(s.submittedAt).toLocaleString('tr-TR') : ''}</span></div>
      <span class="status ${s.status==='degerlendirildi'?'graded':'new'}">${s.status==='degerlendirildi'?'Değerlendirildi':'Yeni'}</span>
      <button class="btn danger small" data-del="${s.id}">Sil</button>
    </div>`).join('') : '<p class="hint">Henüz iletilen bir dosya bulunmuyor.</p>';
  return `<header class="top"><div><h1>Akademisyen Paneli<br><small>Halk Sağlığı Hemşireliği</small></h1></div>
  <button class="btn ghost small" data-go="home">Çıkış</button></header>
  <div class="wrap"><div class="card"><h2>İletilen Öğrenci Dosyaları</h2>
  <p class="hint">Bir dosyaya tıklayarak inceleyin ve değerlendirme puanlarını girin.</p>${rows}</div></div>`;
}

function dumpObj(o){
  return esc(JSON.stringify(o||{},null,1)).replace(/[{}"]/g,'').replace(/,\n/g,'\n').trim() || '-';
}

  return `<header class="top"><div><h1>Değerlendirme<br><small>${esc(s.ad)} — ${esc(s.no)}</small></h1></div>

    </div>
    <div class="card">

      <table class="eval">

      <h3>Uygulama Dosyası Kontrol Listesi</h3>
      <div class="overflow-x"><table class="small-table">
      <tr><th>Grup</th><th>Dosya İçeriği</th><th>Var/Yok</th><th>Açıklama</th></tr>
      ${CHECKLIST_ITEMS.map(([grp,label],i)=>{
        const cur = (g.checklist && g.checklist[i]) || {};
        return `<tr><td>${grp}</td><td>${label}</td>
        <td><select id="c_${i}_d"><option value=""></option><option ${cur.durum==='VAR'?'selected':''}>VAR</option><option ${cur.durum==='YOK'?'selected':''}>YOK</option></select></td>
        <td><input type="text" id="c_${i}_a" value="${esc(cur.aciklama||'')}"></td></tr>`;
      }).join('')}
      </table></div>
      <div class="field" style="margin-top:10px"><label>Dosyayı Teslim Alan Öğretim Elemanı</label><input type="text" id="p_teslimAlan" value="${esc(g.teslimAlan||'')}"></div>

      <div id="gradeMsg" style="margin-top:12px"></div>
      <button class="btn" id="saveGrade">Değerlendirmeyi Kaydet</button>
    </div>
  </div>`;
}
function calcToplam(){
  let toplam = 0;
  EVAL_CRITERIA.forEach(([key,label,weight])=>{
    const n1 = +(document.getElementById('p_'+key+'_1')?.value||0);
    const n2 = +(document.getElementById('p_'+key+'_2')?.value||0);
    const w = parseFloat(weight)/100;
    toplam += ((n1+n2)/2) * w;
  });
  const el = document.getElementById('toplamGoster'); if(el) el.textContent = toplam.toFixed(1);
  return toplam;
}
function bindGradeHandlers(){
  document.querySelectorAll('table.eval input').forEach(inpEl=>inpEl.addEventListener('input',calcToplam));
  document.getElementById('saveGrade')?.addEventListener('click', saveGrade);
  document.getElementById('printFacultyBtn')?.addEventListener('click', ()=>window.print());
}
async function saveGrade(){
  const s = submissions.find(x=>x.id===state.detailId);
  if(!s) return;
  const toplam = calcToplam();
  const grade = { degerlendiren: document.getElementById('p_degerlendiren').value, notlar: document.getElementById('p_notlar').value,
    tarih_form: document.getElementById('p_tarih').value, teslimAlan: document.getElementById('p_teslimAlan').value,
    toplam:+toplam.toFixed(1), tarih:new Date().toISOString(), checklist:{} };
  EVAL_CRITERIA.forEach(([key])=>{
    grade[key] = { not1:+(document.getElementById('p_'+key+'_1').value||0), not2:+(document.getElementById('p_'+key+'_2').value||0) };
  });
  CHECKLIST_ITEMS.forEach((item,i)=>{
    grade.checklist[i] = { durum: document.getElementById('c_'+i+'_d').value, aciklama: document.getElementById('c_'+i+'_a').value };
  });
  s.grade = grade;
  s.status = 'degerlendirildi';
  const msg = document.getElementById('gradeMsg');
  msg.innerHTML = '<div class="msg">Kaydediliyor...</div>';
  try{ await Storage.setSubmission(s.id, s); msg.innerHTML = '<div class="msg ok">Değerlendirme kaydedildi.</div>'; }
  catch(e){ msg.innerHTML = '<div class="msg err">Kaydetme sırasında hata oluştu.</div>'; }
}
async function deleteSubmission(id){
  if(!confirm('Bu öğrenci dosyasını kalıcı olarak silmek istediğinize emin misiniz?')) return;
  try{
    await Storage.deleteSubmission(id);
    submissions = submissions.filter(x=>x.id!==id);
    state.view='faculty-panel'; render();
  }catch(e){ alert('Silme sırasında hata oluştu.'); }
}

(async function start(){ await initCapabilities(); render(); })();
